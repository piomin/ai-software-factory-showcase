apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: tickets-system
build:
  artifacts:
    - image: event-service
      context: .
      buildpacks:
        builder: paketobuildpacks/builder-jammy-base
        env:
          - BP_JVM_VERSION=25
          - BP_MAVEN_BUILT_MODULE=services/event-service
          - BP_MAVEN_BUILD_ARGUMENTS=-pl services/event-service -am -DskipTests package
    - image: booking-service
      context: .
      buildpacks:
        builder: paketobuildpacks/builder-jammy-base
        env:
          - BP_JVM_VERSION=25
          - BP_MAVEN_BUILT_MODULE=services/booking-service
          - BP_MAVEN_BUILD_ARGUMENTS=-pl services/booking-service -am -DskipTests package
    - image: frontend
      context: frontend
      docker:
        dockerfile: Dockerfile
manifests:
  rawYaml:
    - k8s/manifests.yaml
deploy:
  kubectl: {}
