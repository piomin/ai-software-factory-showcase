version: 2.1

executors:
  default:
    docker:
      - image: cimg/openjdk:25.0
  validation:
    docker:
      - image: cimg/base:2025.01

commands:
  install-skaffold:
    description: "Download and install skaffold"
    steps:
      - run:
          name: Download skaffold
          command: |
            curl -sL https://github.com/GoogleContainerTools/skaffold/releases/download/v2.25.0/skaffold-linux-amd64 -o /tmp/skaffold
            chmod +x /tmp/skaffold
            /tmp/skaffold version -o '{{.Version}}'

  install-kubeconform:
    description: "Download and install kubeconform"
    steps:
      - run:
          name: Download kubeconform
          command: |
            curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz -o /tmp/kubeconform.tar.gz
            tar xzf /tmp/kubeconform.tar.gz -C /tmp
            /tmp/kubeconform -v

  validate-skaffold:
    description: "Validate skaffold.yaml configuration"
    steps:
      - run:
          name: Validate skaffold.yaml
          command: |
            /tmp/skaffold diagnose --filename skaffold.yaml --yaml-only

  validate-kubernetes:
    description: "Validate Kubernetes manifests offline with kubeconform"
    steps:
      - run:
          name: Validate Kubernetes manifests
          command: |
            /tmp/kubeconform -strict -summary k8s/manifests.yaml

  validate-image-consistency:
    description: "Validate image names consistency between skaffold.yaml and k8s manifests"
    steps:
      - run:
          name: Validate image consistency
          command: |
            # Extract image names from skaffold.yaml artifacts section
            SKAFFOLD_IMAGES=$(sed -n '/^  artifacts:/,/^[a-z]/p' skaffold.yaml | grep '^\s*- image:' | sed 's/.*image:\s*//' | sed 's/\s*$//' | sort -u)
            
            # Extract image names from k8s manifests (base name without tag)
            MANIFEST_IMAGES=$(grep 'image:' k8s/manifests.yaml | sed 's/.*image:\s*//' | sed 's/\s*$//' | sed 's/:[^:]*$//' | sort -u)
            
            echo "Images defined in skaffold.yaml artifacts:"
            echo "$SKAFFOLD_IMAGES"
            echo ""
            echo "Images referenced in k8s/manifests.yaml:"
            echo "$MANIFEST_IMAGES"
            echo ""
            
            # Check each skaffold image is in manifests
            for img in $SKAFFOLD_IMAGES; do
              if ! echo "$MANIFEST_IMAGES" | grep -qx "$img"; then
                echo "ERROR: Image '$img' from skaffold.yaml artifacts not found in k8s/manifests.yaml"
                exit 1
              fi
            done
            
            # Check each manifest image is in skaffold
            for img in $MANIFEST_IMAGES; do
              if ! echo "$SKAFFOLD_IMAGES" | grep -qx "$img"; then
                echo "ERROR: Image '$img' from k8s/manifests.yaml not found in skaffold.yaml artifacts"
                exit 1
              fi
            done
            
            echo "✓ Image consistency check passed"

jobs:
  build-and-test:
    executor: default
    steps:
      - checkout
      - restore_cache:
          keys:
            - v3-m2-{{ checksum "pom.xml" }}-{{ checksum "services/pom.xml" }}-{{ checksum "services/event-service/pom.xml" }}-{{ checksum "services/booking-service/pom.xml" }}-{{ checksum "frontend/pom.xml" }}
            - v2-m2-
      - restore_cache:
          keys:
            - v2-node-{{ checksum "frontend/package-lock.json" }}
            - v2-node-
      - run:
          name: Run Maven build and tests
          command: mvn -B -ntp verify
      - save_cache:
         paths:
           - ~/.m2
         key: v3-m2-{{ checksum "pom.xml" }}-{{ checksum "services/pom.xml" }}-{{ checksum "services/event-service/pom.xml" }}-{{ checksum "services/booking-service/pom.xml" }}-{{ checksum "frontend/pom.xml" }}
      - save_cache:
         paths:
           - frontend/node
           - frontend/node_modules
         key: v2-node-{{ checksum "frontend/package-lock.json" }}
      - store_test_results:
         path: "**/target/surefire-reports"
      - store_artifacts:
         path: "**/target/surefire-reports"

  validate-deployment:
    executor: validation
    steps:
      - checkout
      - install-skaffold
      - install-kubeconform
      - validate-skaffold
      - validate-kubernetes
      - validate-image-consistency

workflows:
  build:
    jobs:
      - build-and-test:
          filters:
            tags:
              ignore: /.*/
      - validate-deployment:
          filters:
            tags:
              ignore: /.*/
