server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: event-service
              uri: ${EVENT_SERVICE_URL:http://event-service:8080}
              predicates:
                - Path=/api/events,/api/events/**
            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:http://booking-service:8080}
              predicates:
                - Path=/api/bookings,/api/bookings/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
